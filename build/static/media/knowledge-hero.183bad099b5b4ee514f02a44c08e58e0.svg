<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" fill="none">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111D"/>
      <stop offset=".55" stop-color="#102238"/>
      <stop offset="1" stop-color="#1B3048"/>
    </linearGradient>
    <radialGradient id="constellationGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 185 -600 0 1190 93)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67C9D0" stop-opacity=".2"/>
      <stop offset=".58" stop-color="#FF855F" stop-opacity=".08"/>
      <stop offset="1" stop-color="#67C9D0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="0" y="0" width="1600" height="200" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .signal { stroke-dasharray: 8 15; animation: signal 9s linear infinite; }
    .pulse { animation: pulse 3.8s ease-in-out infinite; }
    .pulse-late { animation: pulse 4.6s ease-in-out -2.1s infinite; }
    .float { animation: float 6s ease-in-out infinite alternate; }
    .float-late { animation: float 7s ease-in-out -3s infinite alternate; }
    @keyframes signal {
      to { stroke-dashoffset: -184; }
    }
    @keyframes pulse {
      50% { opacity: .35; }
    }
    @keyframes float {
      to { transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .pulse, .pulse-late, .float, .float-late { animation: none; }
    }
  </style>
  <path fill="url(#background)" d="M0 0h1600v200H0z"/>
  <path fill="url(#constellationGlow)" d="M0 0h1600v200H0z"/>
  <path d="M0 171c212-30 445-24 630 2 225 31 423 27 631-6 129-20 247-22 339-8v41H0v-29Z" fill="#050A11" fill-opacity=".72"/>

